<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senet Royal</title>

<style>
html,body{
    margin:0;
    min-height:100%;
    background:#0b0704;
    color:#f0d28b;
    font-family:Georgia,serif;
}

body{
    display:flex;
    justify-content:center;
}

#app{
    width:100%;
    max-width:600px;
    min-height:100vh;
    text-align:center;
    padding:30px 20px;
    box-sizing:border-box;
}

.logo{
    margin-top:70px;
    font-size:36px;
    font-weight:bold;
    letter-spacing:4px;
}

.ankh{
    font-size:70px;
    color:#e2b85d;
}

.subtitle{
    margin-top:10px;
    color:#a88a55;
    font-size:13px;
    letter-spacing:2px;
}

button{
    width:100%;
    margin-top:40px;
    padding:17px;
    border:0;
    border-radius:14px;
    background:linear-gradient(#e5c06f,#9c692b);
    color:#1b1007;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="app">

    <div class="ankh">☥</div>

    <div class="logo">
        SENET ROYAL
    </div>

    <div class="subtitle">
        THE ANCIENT EGYPTIAN GAME
    </div>

    <button onclick="alert('Senet Royal is working!')">
        START GAME
    </button>

</div>

</body>
</html>
