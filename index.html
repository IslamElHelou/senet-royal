<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120b06">
<title>Senet Royal</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#080503;
  color:#f2d79a;
  font-family:Georgia,"Times New Roman",serif;
}

body{
  display:flex;
  justify-content:center;
}

button{
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}

#app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  padding:18px;
  background:
    radial-gradient(circle at 50% 0%,#4a2b0d 0%,#1c1008 35%,#080503 75%);
}

/* HOME */

.header{
  text-align:center;
  padding:30px 10px 25px;
}

.ankh{
  font-size:58px;
  line-height:1;
  color:#e5b95e;
  text-shadow:0 0 25px #d59a35;
}

.logo{
  font-size:32px;
  font-weight:bold;
  letter-spacing:4px;
  color:#f1d18b;
}

.subtitle{
  margin-top:7px;
  color:#9d8458;
  font-size:12px;
  letter-spacing:2px;
}

.panel{
  background:rgba(25,15,8,.95);
  border:1px solid #6b4b24;
  border-radius:22px;
  padding:20px;
  box-shadow:0 15px 40px #000;
}

.section-title{
  font-size:13px;
  color:#b99a61;
  margin:5px 0 10px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.options{
  display:flex;
  gap:8px;
}

.option{
  flex:1;
  border:1px solid #634723;
  border-radius:12px;
  background:#1d1209;
  color:#d9bd7b;
  padding:13px 5px;
  font-size:14px;
}

.option.active{
  background:linear-gradient(#dfb968,#9a6828);
  color:#1b1006;
  border-color:#e0b65c;
  font-weight:bold;
}

.main-button{
  width:100%;
  margin-top:20px;
  border:0;
  border-radius:14px;
  padding:16px;
  background:linear-gradient(#edc978,#a56f2d);
  color:#1b1006;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 5px 15px #0008;
}

.secondary{
  width:100%;
  border:0;
  background:none;
  color:#c6a66b;
  padding:14px;
  font-size:14px;
}

/* GAME */

.game-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.small-button{
  border:1px solid #604622;
  background:#171008;
  color:#e1c17a;
  border-radius:10px;
  padding:9px 13px;
}

.game-title{
  text-align:center;
  font-size:20px;
  letter-spacing:2px;
}

.turn{
  text-align:center;
  color:#dcb96e;
  font-size:12px;
  margin-top:3px;
}

.score{
  display:flex;
  justify-content:space-between;
  background:#130c07;
  border:1px solid #4e371c;
  border-radius:14px;
  padding:12px 16px;
  margin-bottom:12px;
}

.player{
  font-size:14px;
}

.player.right{
  text-align:right;
}

.count{
  color:#9f8658;
  font-size:11px;
  margin-top:3px;
}

/* BOARD */

.board-wrap{
  padding:7px;
  border-radius:18px;
  background:linear-gradient(135deg,#6c4b24,#b88943,#62431f);
  box-shadow:0 12px 30px #000;
}

.board{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  overflow:hidden;
  border-radius:12px;
  border:2px solid #3e2812;
}

.cell{
  position:relative;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#d6b36c;
  border:1px solid #a0783d;
}

.cell:nth-child(even){
  background:#c69f59;
}

.cell.safe{
  background:#d9b873;
}

.cell.home{
  background:#9f733b;
}

.number{
  position:absolute;
  top:3px;
  left:4px;
  font-family:Arial,sans-serif;
  font-size:8px;
  color:#5a3a19;
  opacity:.8;
}

.mark{
  position:absolute;
  bottom:3px;
  right:4px;
  font-size:10px;
  color:#70491c;
}

/* PIECES */

.piece{
  width:34px;
  height:34px;
  border-radius:50%;
  border:2px solid #563915;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:bold;
  box-shadow:0 3px 5px #0008;
  cursor:pointer;
  z-index:2;
}

.piece.gold{
  background:radial-gradient(circle at 35% 30%,#ffe6a0,#c78d35 70%);
  color:#4b2b0b;
}

.piece.dark{
  background:radial-gradient(circle at 35% 30%,#76604a,#241a12 70%);
  color:#efd28c;
}

.cell.legal{
  box-shadow:
    inset 0 0 0 3px #fff0a0,
    inset 0 0 18px #d49c35;
}

/* STICKS */

.sticks{
  height:78px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.stick{
  width:21px;
  height:52px;
  border-radius:6px;
  background:#e1bd72;
  border:1px solid #765221;
  box-shadow:0 4px 7px #0008;
  transform:rotate(-3deg);
}

.stick.dark{
  background:#392a1b;
}

.message{
  min-height:30px;
  text-align:center;
  color:#e4c277;
  font-weight:bold;
  font-size:14px;
}

.roll{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  background:linear-gradient(#e5bf6b,#98682b);
  color:#1c1107;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 5px 15px #0008;
}

.roll:disabled{
  opacity:.45;
}

/* RULES */

.rules{
  line-height:1.7;
  color:#cdb889;
  font-size:14px;
}

.rules h3{
  color:#e2bd6e;
}

/* WIN */

.overlay{
  position:fixed;
  inset:0;
  background:#000c;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  z-index:10;
}

.win{
  width:min(400px,100%);
  text-align:center;
  background:#1a1008;
  border:1px solid #745126;
  border-radius:24px;
  padding:30px 22px;
  box-shadow:0 20px 50px #000;
}

.crown{
  font-size:55px;
}

.win h2{
  color:#e5bf70;
  font-size:28px;
}

@media(max-width:380px){
  #app{padding:11px}
  .piece{width:28px;height:28px;font-size:12px}
  .cell{aspect-ratio:1/.95}
  .logo{font-size:27px}
}
</style>
</head>

<body>

<div id="app"></div>

<script>
"use strict";
